spring.jpa.hibernate.ddl-auto=none

# Fixed JWT secret for tests — must be ≥ 32 bytes for HS256.
app.jwt.secret=test-secret-must-be-at-least-32-bytes-for-hs256-algo
app.jwt.expiration-minutes=15

# CORS allowed origins (SecurityConfig requires this; the main application.properties is
# shadowed on the test classpath, so it must be declared here too).
app.cors.allowed-origins=http://localhost:5173
