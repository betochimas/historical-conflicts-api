spring.application.name=historical-conflicts-api

# Server - bind to the platform-injected PORT in prod; default 8080 locally.
server.port=${PORT:8080}

# CORS - origins allowed to call the API from a browser. Default covers local Vite/React dev;
# override in prod with APP_CORS_ALLOWED_ORIGINS (comma-separated) to the deployed portfolio origin.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator - expose only the health endpoint for the platform's health check.
management.endpoints.web.exposure.include=health

# Local-only secret overrides (DB_PASSWORD, JWT_SECRET). Gitignored; absent in prod, where real env vars are set.
spring.config.import=optional:application-local.properties

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/conflicts
spring.datasource.username=postgres
# Password supplied via environment variable; local value lives in the gitignored application-local.properties.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MVC - throw a proper exception for unknown routes so the error handler can catch it
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Redis - backs the cache layer. Host/port default to a local instance; override via env vars.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT - secret must be supplied via environment variable (no default; app fails to start if unset).
# Must be at least 32 bytes (256 bits) for HS256.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Registration - public self-registration. Disable in the hosted demo (APP_REGISTRATION_ENABLED=false)
# so the pre-seeded shared demo account is the only write path.
app.registration.enabled=${APP_REGISTRATION_ENABLED:true}

# Demo data reset - nightly restore of the seeded domain data so visitor edits don't accumulate.
# Off by default; enable only in the hosted demo (APP_DEMO_RESET_ENABLED=true).
app.demo.reset.enabled=${APP_DEMO_RESET_ENABLED:false}
app.demo.reset.cron=${APP_DEMO_RESET_CRON:0 0 4 * * *}
