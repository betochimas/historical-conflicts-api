# Prod profile (Cloud Run). Activated via SPRING_PROFILES_ACTIVE=prod.
# The base application.properties still applies; these override/augment it for the hosted demo.

# Cache backend is in-process Caffeine here (see CacheConfig#caffeineCacheManager), so there is no
# Redis. The actuator health group auto-adds a "redis" contributor whenever the redis starter is on
# the classpath; without this it would try to ping localhost:6379 and report DOWN, failing Cloud Run's
# health check. Disable it explicitly.
management.health.redis.enabled=false

# Quieter, prod-appropriate SQL logging (the base file turns these on for local dev).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
