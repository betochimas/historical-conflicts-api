name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        # Testcontainers spins up postgres:18 and redis:7-alpine; ubuntu-latest
        # has Docker preinstalled, so no extra setup is needed.
        run: ./mvnw -B test
